[build]
  base = "frontend"
  command = "npm run build:tauri"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "11.19.0"
  VITE_HOSTED_CHAT = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
